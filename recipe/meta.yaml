{% set name = "nccl4py" %}
{% set version = "0.6.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # NVIDIA tags nccl4py releases separately as `nccl4py-vX.Y.Z` on the
  # NVIDIA/nccl repository; the tarball extracts to `nccl-nccl4py-vX.Y.Z/`
  # with the Python package at `nccl4py/` in that root.
  url: https://github.com/NVIDIA/nccl/archive/refs/tags/nccl4py-v{{ version }}.tar.gz
  sha256: a3ecbd6cf69d040a4e6eeb60cd207c8014233eeeeb3eddffd556ebdba79796ba

build:
  number: 0
  skip: true  # [not linux]
  ignore_run_exports:
    # nccl4py is CUDA-major-agnostic: its compiled extensions use only opaque
    # CUDA handle types (cudaStream_t, etc. from driver_types.h) and do not
    # link libcudart. NCCL is dlopen'd at runtime via cuda-pathfinder, so a
    # single build can serve either a CUDA 12 or CUDA 13 environment. Drop the
    # normal run_exports that would otherwise pin cuda-version to the build's
    # CUDA major (analogous to CUDA Enhanced Compatibility).
    - cuda-version
  ignore_run_exports_from:
    - cuda-cudart-dev

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - {{ compiler("cuda") }}
    - arm-variant * {{ arm_variant_type }}  # [aarch64]
  host:
    - python
    - pip
    - setuptools >=80
    - setuptools-scm >=10.2,<11
    - cython >=3.1
    - cuda-version {{ cuda_compiler_version }}.*
    - cuda-cudart-dev
  run:
    - python
    - numpy
    - packaging
    - cuda-core >=1.0,<2.0a0
    - cuda-pathfinder >=1.5.4,<2.0a0
    - cuda-bindings
    - cuda-version >=12,<14.0a0
    # Anaconda: require NCCL >=2.30.7.
    # - The 0.6.0 bindings are generated against NCCL 2.32.3, but newer APIs
    #   are dlsym'd lazily, so a 2.30.7 runtime still imports and runs plain
    #   collectives.
    #   See: bindings/nccl4py/nccl/bindings/_internal/nccl_linux.pyx
    # - Upstream documents NCCL 2.30.7 as the CuTe DSL baseline.
    #   See: bindings/nccl4py/examples/cute/README.md
    # - Optional features need newer runtimes: 2.31.0 for the Gin
    #   barrier-session pointer ABI, 2.31.1 for ncclGinGet, and 2.32 for the
    #   NVLS/CFT host APIs and WindowFlag.GIN_ONLY/CFT_COUNTED.
    # - conda-forge only needs >=2.30, but Anaconda ships nccl 2.30.4.1,
    #   which is below upstream's baseline, hence the 2.30.7 lower bound.
    - nccl >=2.30.7,<3.0a0
    - nvidia-cutlass-dsl >=4.6,<5

test:
  imports:
    - nccl
    - nccl.bindings
    - nccl.core
    # Requires "nccl_ep" plugin: https://github.com/NVIDIA/nccl/tree/master/contrib/nccl_ep
    #- nccl.ep
  requires:
    - pip
  commands:
    - pip check
    # Anaconda: fail if setuptools-scm could not supply the version. Without
    # it the dist-info is named nccl4py-0.0.0 and nccl.core.__version__ lies.
    - python -c 'import nccl, nccl.bindings, nccl.core; print(nccl.core.__version__); assert nccl.core.__version__ == "{{ version }}"'

about:
  home: https://developer.nvidia.com/nccl
  license: BSD-3-Clause
  license_file: LICENSE.txt
  license_family: BSD
  summary: Python bindings for NVIDIA NCCL
  description: |
    NCCL4Py provides Pythonic access to NCCL for efficient multi-GPU and
    multi-node collective communication and point-to-point transfers. It
    ships low-level Cython bindings plus a high-level `nccl.core` API.
  doc_url: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/index.html
  dev_url: https://github.com/NVIDIA/nccl

extra:
  recipe-maintainers:
    - conda-forge/cuda
